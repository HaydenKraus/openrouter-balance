[package]
name = "openrouter-balance"
version = "1.0.2"
edition = "2021"
license = "MIT"

[dependencies]
base64 = "0.22"
chrono = "0.4.45"
eframe = "0.37.0"
egui = "0.37.0"
keyring = { version = "3", features = ["windows-native"] }
open = "5.4.5"
rand = "0.8"
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tauri-winrt-notification = "0.8.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_Security", "Win32_System_LibraryLoader", "Win32_UI_HiDpi"] }

[build-dependencies]
winresource = "0.1.34"


[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
panic = "unwind"
